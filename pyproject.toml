[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aarav-inference-api"
version = "1.0.0"
description = "Aarav Image Generation API - Asynchronous Vendor-Agnostic Inference Gateway"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "diffusers>=0.30.0",
    "transformers>=4.44.0",
    "accelerate>=0.30.0",
    "safetensors>=0.4.0",
    "peft>=0.11.0",
    "pillow>=10.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
postgres = [
    "asyncpg>=0.29.0",
]
test = [
    "pytest>=9.0.0",
    "pytest-asyncio>=0.23.0",
    "asyncpg>=0.29.0",
]


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
