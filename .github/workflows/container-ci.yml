name: "Inference-1 API Container CI"

"on":
  push:
    branches: [ "main" ]
    paths:
      - "Dockerfile.api"
      - ".dockerignore"
      - "requirements-api.txt"
      - "requirements-api.lock"
      - "src/**"
      - "alembic/**"
      - "alembic.ini"
      - "pyproject.toml"
      - "tests/**"
      - ".github/workflows/container-ci.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "Dockerfile.api"
      - ".dockerignore"
      - "requirements-api.txt"
      - "requirements-api.lock"
      - "src/**"
      - "alembic/**"
      - "alembic.ini"
      - "pyproject.toml"
      - "tests/**"
      - ".github/workflows/container-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  offline-tests:
    name: "Offline Invariant & Full Unit Test Suite"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Development and Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.lock
          pip install pytest pytest-asyncio aiosqlite

      - name: Run Staging Readiness & Invariant Tests
        run: |
          pytest tests/unit/test_staging_readiness.py -v

      - name: Run Full Unit Test Suite
        run: |
          pytest tests/unit/ -v

  clean-container-build:
    name: "Clean Docker Build & Runtime Smoke Test"
    needs: offline-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build API Container Without Cache
        run: |
          # Enforces clean compilation from declared lockfile inputs
          docker build \
            --no-cache \
            -f Dockerfile.api \
            -t inference-api:ci-${{ github.sha }} \
            .

      - name: Verify Non-Root User & GPU Dependency Absence
        run: |
          # 1. Verify non-root user (UID 10001)
          UID_CHECK=$(docker run --rm inference-api:ci-${{ github.sha }} id -u)
          if [ "$UID_CHECK" != "10001" ]; then
            echo "Security violation: Container is running with UID $UID_CHECK instead of 10001." >&2
            exit 1
          fi

          # 2. Verify torch and heavy diffusion dependencies are completely excluded
          docker run --rm inference-api:ci-${{ github.sha }} python -c "
          import sys
          for mod in ['torch', 'torchvision', 'diffusers', 'transformers', 'accelerate', 'safetensors', 'peft']:
              try:
                  __import__(mod)
                  print(f'Error: Forbidden module {mod} is present in API container!', file=sys.stderr)
                  sys.exit(1)
              except ImportError:
                  pass
          print('Clean container verified: zero GPU diffusion packages present.')
          "

      - name: Isolated Container Runtime Smoke Test
        run: |
          CONTAINER_NAME="ci-smoke-test-${{ github.sha }}"

          # Launch detached test container on loopback port 8001
          docker run -d \
            --name "${CONTAINER_NAME}" \
            -p 127.0.0.1:8001:8000 \
            -e ENVIRONMENT=development \
            -e DEPLOYMENT_MODE=hybrid \
            -e RUN_EMBEDDED_WORKER=false \
            -e RUN_LEASE_SWEEPER=false \
            -e RUN_DELETION_OUTBOX_WORKER=false \
            -e METRICS_REQUIRE_AUTH=false \
            -e DATABASE_URL="postgresql+asyncpg://mock_user:mock_pass@127.0.0.1:5432/mock_db" \
            -e ENABLE_PHYSICAL_ASSET_DELETION=false \
            inference-api:ci-${{ github.sha }}

          # Wait up to 15s for liveness probe
          echo "Waiting for container liveness probe..."
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:8001/health/liveness; then
              echo "Liveness probe healthy."
              break
            fi
            sleep 1
          done

          # Verify readiness fails closed (HTTP 503) without live database
          READINESS_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8001/health/readiness || true)
          if [ "$READINESS_STATUS" != "503" ]; then
            echo "Violation: Readiness probe returned HTTP $READINESS_STATUS instead of 503." >&2
            docker logs "${CONTAINER_NAME}"
            exit 1
          fi
          echo "Readiness probe properly failed closed with HTTP 503."

          # Verify Prometheus metrics telemetry endpoint
          curl -sf http://127.0.0.1:8001/metrics > /dev/null
          echo "Prometheus telemetry endpoint verified."

          # Graceful teardown
          docker stop --time 15 "${CONTAINER_NAME}"
          echo "CI container smoke test completed cleanly."

      - name: Teardown and Clean Up Smoke Test Container
        if: always()
        run: |
          CONTAINER_NAME="ci-smoke-test-${{ github.sha }}"
          if docker ps -a --format '{{.Names}}' | grep -Eq "^${CONTAINER_NAME}$"; then
            echo "Cleaning up container ${CONTAINER_NAME}..."
            docker stop --time 15 "${CONTAINER_NAME}" || true
            docker rm -f "${CONTAINER_NAME}" || true
          fi
